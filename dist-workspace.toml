# Release builds (plan D42): `dist generate` turns this into .github/workflows/release.yml.
# Push a tag like v0.1.0 to build every target, publish a GitHub Release and update the Homebrew tap.
[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.32.0"
ci = "github"
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
installers = ["shell", "powershell", "homebrew"]
tap = "kondfox/homebrew-tap"
formula = "pmx"
publish-jobs = ["homebrew"]
install-path = "CARGO_HOME"
install-updater = false
# The dashboard (Node) and the WASM engine are built into the binary; see build-setup.yml.
github-build-setup = "../build-setup.yml"
