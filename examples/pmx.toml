# Example pmx project config (fictional). Schema: wiki/tool-implementation-plan.md §3.3.
# Tokens are referenced by env-var name only; never put secrets in this file.

[project]
name = "Acme Shop"
range_start = "2024-09-01"
breadth_roles = ["frontend", "backend", "mobile", "qa", "infra"]
ai_attribution = true

[[repo]]
path = "~/src/acme/shop-api"          # local clone…
branch = "origin/development2"
role = "backend"
code_host_id = 785                    # GitLab project id (or "group/project"); GitHub: "owner/repo"

[[repo]]
url = "git@gitlab.example.com:acme/shop-web.git"   # …or a URL pmx clones itself
role = "frontend"

[[repo]]
path = "~/src/acme/shop-legacy"
role = "per-file"                 # monorepo role rules for this repo only (spec §1.5)
classifier = "local"              # per-repo override of [velocity] classifier
data_policy = "local-only"        # refuse any classifier that sends code off this machine

[code_host]                       # PR flow (spec §8); repos without code_host_id are not read
type = "gitlab"                   # or "github"
base = "https://gitlab.example.com"   # default gitlab.com; for GitHub only Enterprise Server needs it
token_env = "GL_TOKEN"            # default GITLAB_TOKEN / GITHUB_TOKEN; read access is enough

[people]
"Jane Doe" = ["jane.doe@example.com", "jdoe"]   # emails and logins together
bots = ["gitlab-runner@example.com"]   # emails, names or logins
externals = ["Sam Contractor"]

[fte]                             # spec §10.2
source = "static"
value = 4.5                       # or periods = [{ from = "2026-08-01", to = "2026-08-31", fte = 4.5 }, …]
# source = "file", file = "fte.json"   # JSON keyed by project name

[[secrets_triage]]
repo = "shop-api"
file = "certs/dev.pem"
verdict = "rotated"
by = "Jane Doe"
date = "2026-10-08"

[snapshots]                       # duplication, complexity, security (spec §3.4, §7)
cadence = "weekly"                # or "monthly" (month-ends only: fewer trees to scan)
sast_rules = ["~/rules/semgrep"]  # semgrep rule files or folders; none → SAST "not measured"
# since = "2026-01-01"            # don't scan trees before this date
# jobs = 2                        # trees scanned at once

[classifiers.claude]              # LLM classifiers for Velocity (spec §10.3, plan §6)
provider = "claude-code"          # the Claude Code CLI under your own login (subscription or API)
model = "claude-sonnet-5-5"       # pin a versioned id: it is part of the answer cache key
# jobs = 4                        # packages classified at once

[classifiers.local]
provider = "command"              # any program: request JSON on stdin, response JSON on stdout
command = ["./tools/my-classifier", "--model", "qwen3-coder:30b"]

[velocity]
classifier = "claude"             # project default
# since = "2026-01-01"            # score work packages from this date only (default range_start)
