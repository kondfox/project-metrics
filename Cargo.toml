[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kondfox/project-metrics"

[workspace.dependencies]
pm-classify = { path = "crates/pm-classify" }
pm-config = { path = "crates/pm-config" }
pm-git = { path = "crates/pm-git" }
pm-metrics = { path = "crates/pm-metrics" }
pm-progress = { path = "crates/pm-progress" }
pm-snapshot = { path = "crates/pm-snapshot" }
pmx = { path = "crates/pmx" }

anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
clap = { version = "4", features = ["derive"] }
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
tempfile = "3"
dirs = "6"
flate2 = "1"
libm = "0.2"
ts-rs = { version = "12", features = ["chrono-impl", "serde-json-impl", "no-serde-warnings"] }
thiserror = "2"
toml = "1"
toml_edit = "0.25"
ureq = "3"
walkdir = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
